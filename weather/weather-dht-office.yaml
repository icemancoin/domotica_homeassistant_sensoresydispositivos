esphome:
  name: weather-nodemcu-dht11
  friendly_name: Weather DHT11 NodeMCU

esp8266:
  board: nodemcuv2

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Weather-Office Fallback"
    password: !secret ap_password

captive_portal:

sensor:
  - platform: dht
    pin:
      number: D5
      # pullup: false  # Actívalo solo si tu módulo ya lleva resistencia y ves errores
    model: DHT11
    update_interval: 10s
    temperature:
      name: "Temperatura office"
      id: temp_c
      device_class: temperature
      state_class: measurement
    humidity:
      name: "Humedad office"
      id: hum_pct
      device_class: humidity
      state_class: measurement
      accuracy_decimals: 0
